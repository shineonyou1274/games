<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>맞짱 두뇌대결</title>
<meta name="theme-color" content="#6b4fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap"></noscript>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Baloo 2','Noto Sans KR',system-ui,sans-serif;color:#fff;
    background:#2b1d5e;touch-action:none;user-select:none;-webkit-user-select:none;
    display:flex;align-items:center;justify-content:center;
  }
  #stage{position:relative;width:100%;height:100dvh;max-width:760px;display:flex;flex-direction:column;overflow:hidden}

  /* ── 플레이어 반쪽 ── */
  .side{
    position:relative;flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.2vh;padding:2vh 3vw;
    transition:background .18s;
  }
  .side.p1{background:linear-gradient(180deg,#123f63,#0d2f4d);transform:rotate(180deg)}
  .side.p2{background:linear-gradient(180deg,#5a1f3f,#3d1430)}
  .side.win{background:linear-gradient(180deg,#1d7a4a,#125733)}
  .side.lose{background:linear-gradient(180deg,#7a1d1d,#571212)}
  .side .name{
    font-size:clamp(13px,2.4vh,18px);font-weight:800;letter-spacing:1px;opacity:.85;
    display:flex;align-items:center;gap:8px;
  }
  .side .dot{width:12px;height:12px;border-radius:50%}
  .p1 .dot{background:#4df3ff}.p2 .dot{background:#ff7d9e}
  .side .score{
    font-size:clamp(34px,8vh,72px);font-weight:800;line-height:1;
    text-shadow:0 4px 0 rgba(0,0,0,.28);
  }
  .pads{display:flex;gap:3vw;width:100%;max-width:440px;justify-content:center}
  .pad{
    flex:1;max-width:190px;aspect-ratio:1.5/1;min-height:64px;
    border:3px solid rgba(255,255,255,.5);border-radius:22px;
    background:rgba(255,255,255,.12);color:#fff;
    font-family:inherit;font-size:clamp(28px,6.4vh,52px);font-weight:800;
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s,background .12s;
  }
  .pad:active,.pad.hit{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.28);background:rgba(255,255,255,.3)}
  .pad.o{color:#8cf5c0}.pad.x{color:#ffb3b3}
  .side .keyhint{font-size:clamp(10px,1.6vh,13px);opacity:.6;font-family:'Noto Sans KR',sans-serif}

  /* ── 가운데 문제 ── */
  #center{
    position:relative;flex:0 0 auto;min-height:24vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;
    background:linear-gradient(180deg,#3a2a7d,#2b1d5e);
    border-top:3px solid rgba(255,255,255,.22);border-bottom:3px solid rgba(255,255,255,.22);
    padding:1.6vh 4vw;text-align:center;
  }
  #cat{font-size:clamp(11px,1.8vh,14px);letter-spacing:2px;color:#c5b6ff;font-weight:800}
  #q{
    font-size:clamp(24px,5.6vh,52px);font-weight:800;line-height:1.25;
    font-family:'Baloo 2','Noto Sans KR',sans-serif;word-break:keep-all;
  }
  #q.flip{animation:flip .3s ease-out}
  @keyframes flip{from{transform:rotateX(90deg) scale(.9);opacity:0}}
  #bar{position:absolute;left:0;bottom:0;height:5px;background:#ffd45e;width:100%}
  #msg{font-size:clamp(12px,2vh,16px);color:#ffd45e;font-weight:800;min-height:1.4em}
  #round{position:absolute;top:6px;left:50%;transform:translateX(-50%);
    font-size:clamp(10px,1.6vh,12px);color:#a99ce0;letter-spacing:1px}
  #big{
    position:absolute;inset:0;display:none;place-items:center;
    font-size:clamp(50px,14vh,120px);font-weight:800;color:#fff;
    background:rgba(24,16,60,.82);text-shadow:0 0 30px rgba(255,212,94,.7);
  }
  #big.on{display:grid;animation:pulse .6s ease-out}
  @keyframes pulse{from{transform:scale(1.5);opacity:0}}

  /* ── 오버레이 ── */
  .ovl{
    position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;
    padding:22px;background:rgba(20,12,48,.9);backdrop-filter:blur(4px);
    overflow-y:auto;touch-action:pan-y;
  }
  .ovl.on{display:flex}
  .ovl>*{flex:none;max-width:100%}
  .ovl h2{font-size:clamp(26px,5vh,40px);text-shadow:0 3px 0 rgba(0,0,0,.3)}
  .ovl p{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:14.5px;
    line-height:1.8;color:#d6ccff;word-break:keep-all;max-width:460px}
  .btn{
    margin-top:4px;padding:13px 34px;border:none;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:20px;font-weight:800;color:#3a2000;
    background:linear-gradient(#ffd964,#f5a324);box-shadow:0 5px 0 #c67a12;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c67a12}
  .btn.alt{color:#fff;background:linear-gradient(#8a6cf0,#5a3fc0);box-shadow:0 5px 0 #3f2a91}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:460px}
  .chip{
    border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.10);
    color:#e7e0ff;border-radius:999px;padding:8px 16px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:800;
  }
  .chip.on{background:linear-gradient(#ffd964,#f5a324);color:#3a2000;border-color:transparent}
  .tally{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#a99ce0}
  #homeLink{
    position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:12;
    width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.28);color:#fff;font-size:15px;display:grid;place-items:center;
    text-decoration:none;
  }
</style>
</head>
<body>
<div id="stage">
  <a id="homeLink" href="index.html" aria-label="게임 상자로">🏠</a>

  <section class="side p1" id="side1">
    <div class="name"><span class="dot"></span>플레이어 1</div>
    <div class="score" id="s1">0</div>
    <div class="pads">
      <button class="pad o" data-p="1" data-a="1">O</button>
      <button class="pad x" data-p="1" data-a="0">X</button>
    </div>
    <div class="keyhint">키보드 A = O · S = X</div>
  </section>

  <div id="center">
    <div id="round">ROUND 1</div>
    <div id="cat">준비</div>
    <div id="q">준비되면 시작을 눌러요</div>
    <div id="msg"></div>
    <div id="bar"></div>
    <div id="big"></div>
  </div>

  <section class="side p2" id="side2">
    <div class="name"><span class="dot"></span>플레이어 2</div>
    <div class="score" id="s2">0</div>
    <div class="pads">
      <button class="pad o" data-p="2" data-a="1">O</button>
      <button class="pad x" data-p="2" data-a="0">X</button>
    </div>
    <div class="keyhint">키보드 K = O · L = X</div>
  </section>

  <!-- 시작 -->
  <div class="ovl on" id="ovStart">
    <h2>⚔️ 맞짱 두뇌대결</h2>
    <p>
      기기를 가운데 두고 <b>마주 앉으세요.</b> 가운데 문제가 뜨면
      맞다고 생각하면 <b>O</b>, 아니면 <b>X</b> — <b>먼저 누른 사람</b>만 판정합니다.<br>
      맞히면 1점, 틀리면 상대가 1점. 문제가 뜨기 전에 누르면 <b>부정 출발</b>로 상대 1점!
    </p>
    <div class="chips" id="catChips"></div>
    <div class="chips" id="winChips"></div>
    <button class="btn" id="btnStart">대결 시작</button>
    <div class="tally" id="tally"></div>
  </div>

  <!-- 결과 -->
  <div class="ovl" id="ovEnd">
    <h2 id="endTitle">플레이어 1 승리!</h2>
    <p id="endDetail"></p>
    <div class="row">
      <button class="btn" id="btnAgain">다시 대결</button>
      <button class="btn alt" id="btnHome">처음으로</button>
    </div>
    <div class="tally" id="tally2"></div>
  </div>
</div>

<script src="assets/core.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const ri   = (a,b) => Math.floor(rand(a,b+1));
const pick = a => a[(Math.random()*a.length)|0];
const snd  = GB.makeSound();

/* ── 문제 만들기 ────────────────────────────── */
function isPrime(n){
  if(n<2) return false;
  if(n<4) return true;
  if(n%2===0) return false;
  for(let i=3;i*i<=n;i+=2) if(n%i===0) return false;
  return true;
}
const MATS = {
  '페트병':'플라스틱','비닐봉지':'플라스틱','플라스틱 컵':'플라스틱',
  '신문지':'종이','상자':'종이','공책':'종이',
  '음료 캔':'캔','통조림':'캔',
  '유리병':'유리','잼 병':'유리'
};
const MAT_NAMES = Object.keys(MATS);
const BINS = ['플라스틱','종이','캔','유리'];

const GENS = {
  prime: () => {                                   // 소수 판별
    const n = ri(2, 60);
    return {cat:'소수', q:`${n} 은(는) 소수일까?`, ans:isPrime(n),
            why:isPrime(n) ? `${n}은 1과 자기 자신으로만 나뉘어요.` : `${n} = ${factor(n)}`};
  },
  even: () => {                                    // 짝수·배수
    const n = ri(10, 99);
    if(Math.random()<0.5) return {cat:'짝수', q:`${n} 은(는) 짝수일까?`, ans:n%2===0,
      why:`${n}의 일의 자리는 ${n%10}.`};
    const d = pick([3,5]);
    return {cat:'배수', q:`${n} 은(는) ${d}의 배수일까?`, ans:n%d===0,
      why:`${n} ÷ ${d} = ${(n/d).toFixed(n%d?1:0)}`};
  },
  calc: () => {                                    // 곱셈·덧셈 검산
    const a = ri(3,12), b = ri(3,12);
    const real = a*b;
    const shown = Math.random()<0.5 ? real : real + pick([-9,-6,-4,-2,2,3,6,8]);
    return {cat:'계산', q:`${a} × ${b} = ${shown} ?`, ans:shown===real, why:`${a} × ${b} = ${real}`};
  },
  compare: () => {                                 // 대소 비교
    const a = ri(11,99), b = ri(11,99);
    const op = Math.random()<0.5 ? '>' : '<';
    const truth = op==='>' ? a>b : a<b;
    return {cat:'비교', q:`${a} ${op} ${b} ?`, ans:truth, why:`${a} 와 ${b}`};
  },
  recycle: () => {                                 // 분리배출
    const item = pick(MAT_NAMES), truth = MATS[item];
    const askBin = Math.random()<0.5 ? truth : pick(BINS.filter(b=>b!==truth));
    return {cat:'분리배출', q:`${item} → ${askBin} ?`, ans:askBin===truth,
            why:`${item}은 ${truth}이에요.`};
  }
};
function factor(n){
  const f=[]; let m=n;
  for(let d=2; d*d<=m; d++) while(m%d===0){ f.push(d); m/=d; }
  if(m>1) f.push(m);
  return f.join('×');
}

/* ── 설정 ──────────────────────────────────── */
const CATS = [
  {key:'prime',   label:'소수'},
  {key:'even',    label:'짝수·배수'},
  {key:'calc',    label:'계산'},
  {key:'compare', label:'비교'},
  {key:'recycle', label:'분리배출'}
];
let onCats = GB.store.read('duelCats', ['prime','even','calc','recycle']);
let winTarget = GB.store.read('duelTarget', 5);
let stats = GB.store.read('duelStats', {games:0, p1:0, p2:0});

const chipsC = $('catChips'), chipsW = $('winChips');
CATS.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'chip' + (onCats.includes(c.key) ? ' on' : '');
  b.textContent = c.label;
  b.onclick = ()=>{
    if(onCats.includes(c.key)){
      if(onCats.length<=1) return;                 // 최소 하나는 남긴다
      onCats = onCats.filter(k=>k!==c.key);
    } else onCats = onCats.concat(c.key);
    b.classList.toggle('on');
    GB.store.write('duelCats', onCats);
  };
  chipsC.appendChild(b);
});
[3,5,7].forEach(n=>{
  const b = document.createElement('button');
  b.className = 'chip' + (winTarget===n ? ' on' : '');
  b.textContent = n + '점 선승';
  b.onclick = ()=>{
    winTarget = n; GB.store.write('duelTarget', n);
    [...chipsW.children].forEach(c=>c.classList.remove('on'));
    b.classList.add('on');
  };
  chipsW.appendChild(b);
});
function showTally(){
  const t = stats.games
    ? `지금까지 ${stats.games}판 — 플레이어 1 ${stats.p1}승 · 플레이어 2 ${stats.p2}승`
    : '';
  $('tally').textContent = t; $('tally2').textContent = t;
}
showTally();

/* ── 대결 진행 ─────────────────────────────── */
const ANSWER_MS = 5000;                            // 한 문제 제한 시간
let score = [0,0], round = 0, phase = 'idle';      // idle | count | live | judged
let cur = null, tStart = 0, timer = null, raf = 0;

const side = [null, $('side1'), $('side2')];
const qEl = $('q'), catEl = $('cat'), msgEl = $('msg'), barEl = $('bar'),
      bigEl = $('big'), roundEl = $('round');

function setScore(){
  $('s1').textContent = score[0];
  $('s2').textContent = score[1];
}
function clearSides(){ side[1].classList.remove('win','lose'); side[2].classList.remove('win','lose'); }

function startMatch(){
  score = [0,0]; round = 0; setScore(); clearSides();
  $('ovStart').classList.remove('on'); $('ovEnd').classList.remove('on');
  GB.log('duel');
  nextRound();
}
function nextRound(){
  clearSides();
  round++;
  roundEl.textContent = 'ROUND ' + round;
  msgEl.textContent = '';
  barEl.style.width = '100%';
  phase = 'count';
  let n = 3;
  catEl.textContent = '준비';
  qEl.textContent = n;
  bigEl.classList.remove('on');
  snd.beep(440,.12,'square',.07);
  timer = setInterval(()=>{
    n--;
    if(n > 0){ qEl.textContent = n; snd.beep(440+ (3-n)*90, .12, 'square', .07); }
    else{ clearInterval(timer); askQuestion(); }
  }, 620);
}
function askQuestion(){
  cur = GENS[pick(onCats)]();
  catEl.textContent = cur.cat;
  qEl.textContent = cur.q;
  qEl.classList.remove('flip'); void qEl.offsetWidth; qEl.classList.add('flip');
  phase = 'live';
  tStart = performance.now();
  snd.beep(880,.1,'triangle',.08);
  cancelAnimationFrame(raf);
  const tick = ()=>{
    if(phase !== 'live') return;
    const left = 1 - (performance.now()-tStart)/ANSWER_MS;
    barEl.style.width = Math.max(0, left*100) + '%';
    if(left <= 0){ timeUp(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function timeUp(){
  phase = 'judged';
  msgEl.textContent = '아무도 못 눌렀어요 — ' + (cur.ans ? 'O' : 'X') + ' 였어요';
  snd.beep(200,.3,'sawtooth',.08,120);
  setTimeout(()=>{ if(phase==='judged') nextRound(); }, 1500);
}

/** p: 1|2, ansO: true면 O를 눌렀다 */
function press(p, ansO){
  if(phase === 'judged' || phase === 'idle') return;
  const me = p-1, other = p===1 ? 1 : 0;

  if(phase === 'count'){                           // 부정 출발
    phase = 'judged';
    cancelAnimationFrame(raf); clearInterval(timer);
    score[other]++; setScore();
    side[p].classList.add('lose'); side[p===1?2:1].classList.add('win');
    msgEl.textContent = '부정 출발! 플레이어 ' + (other+1) + ' 1점';
    bigEl.textContent = '🚨'; bigEl.classList.add('on');
    snd.beep(160,.35,'sawtooth',.1,80);
    after();
    return;
  }
  phase = 'judged';
  cancelAnimationFrame(raf);
  const correct = (ansO === cur.ans);
  const ms = Math.round(performance.now() - tStart);
  if(correct){
    score[me]++; side[p].classList.add('win'); side[p===1?2:1].classList.add('lose');
    msgEl.textContent = `플레이어 ${p} 정답! (${(ms/1000).toFixed(2)}초) · ${cur.why}`;
    bigEl.textContent = 'P' + p; bigEl.classList.add('on');
    snd.chord([660,880,1180], 70, .12, 'square', .09);
  }else{
    score[other]++; side[p].classList.add('lose'); side[p===1?2:1].classList.add('win');
    msgEl.textContent = `땡! 정답은 ${cur.ans ? 'O' : 'X'} · ${cur.why}`;
    bigEl.textContent = '✖'; bigEl.classList.add('on');
    snd.beep(180,.3,'sawtooth',.09,90);
  }
  setScore();
  after();
}
function after(){
  setTimeout(()=>{
    bigEl.classList.remove('on');
    if(score[0] >= winTarget || score[1] >= winTarget) finish();
    else nextRound();
  }, 1600);
}
function finish(){
  phase = 'idle';
  const w = score[0] > score[1] ? 1 : 2;
  stats.games++; stats[w===1?'p1':'p2']++;
  GB.store.write('duelStats', stats);
  GB.best('duel', Math.max(score[0], score[1]));
  showTally();
  $('endTitle').textContent = `플레이어 ${w} 승리!`;
  $('endDetail').innerHTML =
    `${score[0]} : ${score[1]} · ${round}라운드 만에 ${winTarget}점 선취<br>` +
    `카테고리 ${onCats.map(k=>CATS.find(c=>c.key===k).label).join(' · ')}`;
  $('ovEnd').classList.add('on');
  snd.chord(w===1 ? [523,659,784,1046] : [523,659,784,1046], 110, .18, 'square', .09);
}

/* ── 입력 ──────────────────────────────────── */
document.querySelectorAll('.pad').forEach(b=>{
  b.addEventListener('pointerdown', e=>{
    e.preventDefault();
    b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'), 120);
    press(+b.dataset.p, b.dataset.a === '1');
  });
});
addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k === 'escape'){ location.href = 'index.html'; return; }
  if(phase === 'idle' && (k === ' ' || k === 'enter')){ startMatch(); return; }
  const map = {a:[1,true], s:[1,false], k:[2,true], l:[2,false],
               arrowleft:[2,true], arrowright:[2,false]};
  if(map[k]){ e.preventDefault(); press(map[k][0], map[k][1]); }
});

$('btnStart').onclick = startMatch;
$('btnAgain').onclick = startMatch;
$('btnHome').onclick  = ()=>{ location.href = 'index.html'; };

GB.registerPWA();
})();
</script>
</body>
</html>
